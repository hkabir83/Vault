<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Vault</title>

<!-- Manifest -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A84FF">

<!-- iOS PWA meta -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family Vault">

<!-- iOS icons -->
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">

<style>
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:#f2f2f7; }
header { background:white; padding:15px; text-align:center; font-weight:600; font-size:20px; border-bottom:1px solid #ddd; }
.container { padding:20px; }
input { width:100%; padding:10px; margin:6px 0; border-radius:10px; border:1px solid #ddd; }
button { padding:8px 12px; border-radius:10px; border:none; background:#0A84FF; color:white; margin:5px 0; cursor:pointer; }
button.secondary { background:#8e8e93; }
button.danger { background:#ff3b30; }
table { width:100%; border-collapse:collapse; background:white; }
th, td { padding:10px; border:1px solid #ddd; text-align:left; }
th { background:#f0f0f0; }
.hidden { display:none; }
.top-bar { margin-bottom:15px; }
</style>
</head>
<body>

<header>🔐 Family Vault</header>

<div id="login" class="container">
  <input type="password" id="masterPassword" placeholder="Shared Master Password">
  <button onclick="unlock()">Unlock</button>
  <p id="status"></p>
</div>

<div id="app" class="container hidden">

  <!-- Buttons -->
  <div class="top-bar">
    <button onclick="exportVault()">Export Vault</button>
    <button onclick="document.getElementById('importFile').click()">Import Vault</button>
    <button class="secondary" onclick="lockVault()">Lock</button>
    <input type="file" id="importFile" class="hidden" onchange="importVault(event)">
  </div>

  <!-- Add / Edit Credential -->
  <div class="card">
    <input type="hidden" id="editIndex">
    <input type="text" id="website" placeholder="Website">
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <input type="text" id="notes" placeholder="Notes">
    <button onclick="saveCredential()">Save</button>
  </div>

  <!-- Search -->
  <div class="card">
    <input type="text" id="search" placeholder="Search Vault..." oninput="renderVault()">
  </div>

  <!-- Vault Table -->
  <table>
    <thead>
      <tr>
        <th>Website</th>
        <th>Username</th>
        <th>Password</th>
        <th>Notes</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="vaultTableBody"></tbody>
  </table>

</div>

<script>
let db;
let vault=[];
let masterKey=null;
let salt=null;

// IndexedDB Setup
const request=indexedDB.open("FamilyVaultDB",1);
request.onupgradeneeded=e=>{
  db=e.target.result;
  db.createObjectStore("vaultStore");
};
request.onsuccess=e=>db=e.target.result;
request.onerror=e=>console.error("DB error");

// Derive key
async function deriveKey(password,salt){
  const enc=new TextEncoder();
  const keyMaterial=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},
    keyMaterial,
    {name:"AES-GCM",length:256},
    false,
    ["encrypt","decrypt"]
  );
}

// Unlock vault
async function unlock(){
  const password=document.getElementById("masterPassword").value;
  if(!password)return alert("Enter password");

  const tx=db.transaction("vaultStore","readonly");
  const store=tx.objectStore("vaultStore");
  const getReq=store.get("secureVault");

  getReq.onsuccess=async ()=>{
    const stored=getReq.result;
    if(stored){
      try{
        salt=new Uint8Array(stored.salt);
        masterKey=await deriveKey(password,salt);
        const decrypted=await crypto.subtle.decrypt(
          {name:"AES-GCM",iv:new Uint8Array(stored.iv)},
          masterKey,
          new Uint8Array(stored.data)
        );
        vault=JSON.parse(new TextDecoder().decode(decrypted));
      }catch{
        alert("Wrong password");
        return;
      }
    }else{
      salt=crypto.getRandomValues(new Uint8Array(16));
      masterKey=await deriveKey(password,salt);
      await saveVault();
    }
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    renderVault();
  };
}

// Save vault
async function saveVault(){
  const enc=new TextEncoder();
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const encrypted=await crypto.subtle.encrypt(
    {name:"AES-GCM",iv:iv},
    masterKey,
    enc.encode(JSON.stringify(vault))
  );
  const tx=db.transaction("vaultStore","readwrite");
  tx.objectStore("vaultStore").put({
    salt:Array.from(salt),
    iv:Array.from(iv),
    data:Array.from(new Uint8Array(encrypted))
  },"secureVault");
}

// Render vault table with filter
function renderVault(){
  const container=document.getElementById("vaultTableBody");
  const search=document.getElementById("search").value.toLowerCase();
  container.innerHTML="";
  vault.forEach((item,i)=>{
    if(item.website.toLowerCase().includes(search)||
       item.username.toLowerCase().includes(search)||
       item.notes.toLowerCase().includes(search)){
      container.innerHTML+=`
      <tr>
        <td>${item.website}</td>
        <td>${item.username}</td>
        <td>
          <span id="pw${i}" style="display:none">${item.password}</span>
          <button onclick="togglePw(${i})">Show</button>
        </td>
        <td>${item.notes}</td>
        <td>
          <button onclick="editCredential(${i})">Edit</button>
          <button class="danger" onclick="deleteCredential(${i})">Delete</button>
        </td>
      </tr>`;
    }
  });
}

function togglePw(i){
  const el=document.getElementById("pw"+i);
  el.style.display=el.style.display==="none"?"inline":"none";
}

// CRUD functions
function saveCredential(){
  const website=document.getElementById("website").value;
  const username=document.getElementById("username").value;
  const password=document.getElementById("password").value;
  const notes=document.getElementById("notes").value;
  if(!website||!username||!password)return alert("Missing fields");
  const index=document.getElementById("editIndex").value;
  const data={website,username,password,notes};
  if(index==="") vault.push(data);
  else vault[index]=data;
  document.getElementById("editIndex").value="";
  document.querySelectorAll("input").forEach(i=>i.value="");
  renderVault();
  saveVault();
}

function editCredential(i){
  const item=vault[i];
  document.getElementById("website").value=item.website;
  document.getElementById("username").value=item.username;
  document.getElementById("password").value=item.password;
  document.getElementById("notes").value=item.notes;
  document.getElementById("editIndex").value=i;
}

function deleteCredential(i){
  vault.splice(i,1);
  renderVault();
  saveVault();
}

function lockVault(){
  masterKey=null;
  vault=[];
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("masterPassword").value="";
}

// Export / Import
function exportVault(){
  const tx=db.transaction("vaultStore","readonly");
  tx.objectStore("vaultStore").get("secureVault").onsuccess=e=>{
    const blob=new Blob([JSON.stringify(e.target.result)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="family-vault.secure";
    a.click();
  };
}

async function importVault(event){
  const file=event.target.files[0];
  if(!file)return;
  const text=await file.text();
  const data=JSON.parse(text);
  const tx=db.transaction("vaultStore","readwrite");
  tx.objectStore("vaultStore").put(data,"secureVault");
  alert("Imported successfully. Reload and unlock.");
  location.reload();
}

// Service Worker (PWA offline)
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
